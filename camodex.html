<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamoDex ✦ Sua Pokédex Inteligente</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ==========================================================================
       ✨ CamoDex UI/UX — Cute Kawaii & Cozy Gamer com GSAP Intro Integration
       ========================================================================== */

    :root {
      --bg-page: #181113;
      --bg-intro: #1c1613;

      --card-bg: rgba(43, 27, 61, 0.88);
      --card-border: 1px solid rgba(196, 181, 253, 0.2);
      --card-shadow: 0 25px 65px -15px rgba(0, 0, 0, 0.75), 0 0 40px rgba(139, 92, 246, 0.15);

      --bot-bubble-bg: #3c2456;
      --bot-bubble-border: 1px solid rgba(255, 255, 255, 0.08);
      --user-bubble-bg: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      
      --text-lavender: #f3e8ff;
      --text-lavender-muted: #c4b5fd;
      --accent-purple: #8b5cf6;
      --status-green: #10b981;

      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;

      --radius-card: 20px;
      --radius-bubble: 18px;
      --radius-input: 28px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      width: 100vw; height: 100vh;
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(44, 26, 42, 0.95) 0%, rgba(24, 17, 19, 0.98) 75%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c4b5fd' fill-opacity='0.08'%3E%3C!-- Paw 1 --%3E%3Cellipse cx='15' cy='15' rx='3' ry='2'/%3E%3Ccircle cx='10' cy='10' r='1.5'/%3E%3Ccircle cx='15' cy='8' r='1.5'/%3E%3Ccircle cx='20' cy='10' r='1.5'/%3E%3C!-- Heart --%3E%3Cpath d='M50 12 C50 8, 44 8, 44 12 C44 16, 50 20, 50 20 C50 20, 56 16, 56 12 C56 8, 50 8, 50 12 Z'/%3E%3C!-- Sparkle --%3E%3Cpath d='M20 50 L22 55 L27 57 L22 59 L20 64 L18 59 L13 57 L18 55 Z'/%3E%3C!-- Mini Pokeball --%3E%3Ccircle cx='60' cy='55' r='5' stroke='%23c4b5fd' stroke-width='1' stroke-opacity='0.16' fill='none'/%3E%3Cline x1='55' y1='55' x2='65' y2='55' stroke='%23c4b5fd' stroke-opacity='0.16' stroke-width='1'/%3E%3Ccircle cx='60' cy='55' r='1.5' fill='%23c4b5fd' fill-opacity='0.16'/%3E%3C/g%3E%3C/svg%3E");
      background-repeat: repeat;
      color: var(--text-lavender); font-family: var(--font-body);
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; padding: 20px; position: relative;
    }

    .intro-overlay {
      position: fixed; inset: 0;
      background-color: var(--bg-intro);
      background-image: radial-gradient(circle at 50% 40%, #2d1e27 0%, #1c1613 70%);
      z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
    }

    .pokeball-css {
      width: 110px; height: 110px; border-radius: 50%;
      border: 6px solid #1a1a1a; position: relative;
      overflow: hidden; background: #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), inset 0 -4px 10px rgba(0,0,0,0.15);
    }

    .pokeball-top {
      width: 100%; height: 50%;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      border-bottom: 6px solid #1a1a1a;
    }

    .pokeball-button {
      width: 32px; height: 32px; background: #ffffff;
      border: 6px solid #1a1a1a; border-radius: 50%;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9); z-index: 2;
    }

    .pokeball-button::after {
      content: ''; position: absolute; inset: 3px;
      border-radius: 50%; background: #ffffff;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .intro-logo { text-align: center; opacity: 0; transform: scale(0); }
    .intro-logo h1 {
      font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800;
      color: #ffffff; letter-spacing: -0.02em; text-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
    .intro-logo p { font-size: 1rem; color: var(--text-lavender-muted); margin-top: 4px; font-weight: 500; }

    .skip-btn {
      position: absolute; bottom: 30px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-lavender-muted); padding: 8px 18px; border-radius: 20px;
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease;
    }
    .skip-btn:hover { background: rgba(255, 255, 255, 0.15); color: #ffffff; }

    .chat-card {
      width: 100%; max-width: 900px; height: calc(100vh - 40px); max-height: 850px;
      background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: var(--card-border); border-radius: var(--radius-card); box-shadow: var(--card-shadow);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .eevee-sticker-peeking {
      position: absolute; top: -12px; right: 130px; z-index: 20; pointer-events: none;
      animation: floatBounce 4s infinite ease-in-out;
    }
    @keyframes floatBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .chat-header {
      padding: 18px 24px; background: rgba(30, 18, 45, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(10px); z-index: 10;
    }

    .header-info { display: flex; align-items: center; gap: 14px; }
    .mascot-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #5b367d 0%, #351c4a 100%);
      border: 1.5px solid rgba(196, 181, 253, 0.4);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .header-text h2 { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .header-text p { font-size: 0.78rem; color: var(--text-lavender-muted); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .status-dot { width: 8px; height: 8px; background-color: var(--status-green); border-radius: 50%; box-shadow: 0 0 8px var(--status-green); animation: pulseGreen 2s infinite ease-in-out; }

    @keyframes pulseGreen { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.25); } }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.09); color: var(--text-lavender-muted); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.14); color: #ffffff; transform: translateY(-1px); }

    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }

    .message-row { display: flex; align-items: flex-start; gap: 12px; max-width: 85%; animation: msgFadeIn 0.3s ease-out forwards; }
    @keyframes msgFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message-row.bot { align-self: flex-start; }
    .message-row.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(139, 92, 246, 0.18); border: 1px solid rgba(196, 181, 253, 0.35); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .message-bubble { padding: 14px 18px; border-radius: var(--radius-bubble); font-size: 0.95rem; line-height: 1.6; word-break: break-word; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); }
    .message-row.bot .message-bubble { background-color: var(--bot-bubble-bg); border: var(--bot-bubble-border); color: var(--text-lavender); border-top-left-radius: 4px; }
    .message-row.user .message-bubble { background: var(--user-bubble-bg); color: #ffffff; border-top-right-radius: 4px; }
    .message-time { font-size: 0.72rem; color: rgba(255, 255, 255, 0.4); margin-top: 6px; display: block; text-align: right; }

    .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 12px 18px; background: var(--bot-bubble-bg); border: var(--bot-bubble-border); border-radius: var(--radius-bubble); border-top-left-radius: 4px; width: fit-content; }
    .typing-dot { width: 7px; height: 7px; background: var(--text-lavender-muted); border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

    .quick-prompts-container { padding: 0 24px 12px 24px; display: flex; gap: 8px; overflow-x: auto; }
    .quick-prompts-container::-webkit-scrollbar { display: none; }
    .prompt-chip { background: rgba(60, 36, 86, 0.65); border: 1.5px solid rgba(196, 181, 253, 0.2); color: var(--text-lavender-muted); padding: 8px 16px; border-radius: 9999px; font-size: 0.83rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
    .prompt-chip:hover { background: rgba(139, 92, 246, 0.3); border-color: rgba(196, 181, 253, 0.5); color: #ffffff; transform: translateY(-2px); }

    .chip-pokeball-icon { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-lavender-muted); position: relative; overflow: hidden; flex-shrink: 0; }
    .chip-pokeball-icon::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: #ef4444; }
    .chip-pokeball-icon::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #fff; border-radius: 50%; border: 1px solid #1a1a1a; }

    .input-area { padding: 16px 24px 20px 24px; background: rgba(22, 13, 33, 0.88); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .input-wrapper { background: rgba(18, 10, 27, 0.95); border: 1.5px solid rgba(196, 181, 253, 0.2); border-radius: var(--radius-input); padding: 6px 8px 6px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
    .input-wrapper:focus-within { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
    .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-family: var(--font-body); font-size: 0.95rem; padding: 8px 0; }
    .chat-input::placeholder { color: rgba(255, 255, 255, 0.38); }

    .input-buttons { display: flex; align-items: center; gap: 6px; }
    .action-btn { width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
    .mic-btn { background: rgba(255, 255, 255, 0.06); color: var(--text-lavender-muted); }
    .mic-btn:hover { background: rgba(255, 255, 255, 0.14); color: #ffffff; }
    .mic-btn.listening { background: #ef4444; color: #ffffff; animation: pulseRed 1.2s infinite; }
    @keyframes pulseRed { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .send-btn { background: var(--user-bubble-bg); color: #ffffff; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45); }
    .send-btn:hover { transform: scale(1.06); }
    .footer-credits { text-align: center; font-size: 0.72rem; color: rgba(255, 255, 255, 0.3); margin-top: 8px; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .chat-card { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
      .chat-header { padding: 14px 16px; }
      .chat-messages { padding: 16px; }
      .message-row { max-width: 92%; }
      .quick-prompts-container { padding: 0 16px 10px 16px; }
      .input-area { padding: 12px 16px 16px 16px; }
    }
  </style>
</head>
<body>

  <div class="intro-overlay" id="introOverlay">
    <div class="pokeball-css" id="introPokeball">
      <div class="pokeball-top"></div>
      <div class="pokeball-button"></div>
    </div>
    <div class="intro-logo" id="introLogo">
      <h1>CamoDex ✦</h1>
      <p>Sua Pokédex Inteligente</p>
    </div>
    <button class="skip-btn" id="skipIntroBtn">Pular Animação ➔</button>
  </div>

  <div class="chat-card" id="chatCard">
    <div class="eevee-sticker-peeking">
      <svg width="55" height="38" viewBox="0 0 100 64" fill="none"><path d="M28 32 C12 12 6 0 17 2 C29 4 36 18 32 34 Z" fill="#9B623B" stroke="#3D2314" stroke-width="1.5"/><path d="M24 27 C15 14 10 4 17 5 C24 7 31 18 29 29 Z" fill="#E0A46F"/><path d="M72 32 C88 12 94 0 83 2 C71 4 64 18 68 34 Z" fill="#9B623B" stroke="#3D2314" stroke-width="1.5"/><path d="M76 27 C85 14 90 4 83 5 C76 7 69 18 71 29 Z" fill="#E0A46F"/><ellipse cx="50" cy="42" rx="24" ry="18" fill="#CA8C59" stroke="#3D2314" stroke-width="1.6"/><path d="M28 50 C33 42 67 42 72 50 C76 60 63 62 50 62 C37 62 24 60 28 50 Z" fill="#F7EDE0" stroke="#3D2314" stroke-width="1.2"/><ellipse cx="40" cy="38" rx="4" ry="6" fill="#3D2314"/><circle cx="38.8" cy="35.5" r="1.8" fill="#FFFFFF"/><ellipse cx="60" cy="38" rx="4" ry="6" fill="#3D2314"/><circle cx="58.8" cy="35.5" r="1.8" fill="#FFFFFF"/><polygon points="49.2,44 50.8,44 50,45.5" fill="#3D2314"/><ellipse cx="33" cy="44" rx="3" ry="1.8" fill="rgba(244, 114, 182, 0.45)"/><ellipse cx="67" cy="44" rx="3" ry="1.8" fill="rgba(244, 114, 182, 0.45)"/></svg>
    </div>

    <header class="chat-header">
      <div class="header-info">
        <div class="mascot-avatar">
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="#F4E8D8" stroke="#4A3226" stroke-width="1.5"/>
            <path d="M4 18 C2 25 6 32 12 34 C9 30 7 24 8 18 Z" fill="#6B4434" stroke="#4A3226" stroke-width="0.8"/>
            <path d="M36 18 C38 25 34 32 28 34 C31 30 33 24 32 18 Z" fill="#6B4434" stroke="#4A3226" stroke-width="0.8"/>
            <path d="M8.5 17 C8.5 12 14.5 11 19.5 16 C24.5 11 31.5 12 31.5 17 C31.5 22.5 24.5 23 19.5 18 C14.5 23 8.5 22.5 8.5 17 Z" fill="#FFFFFF"/>
            <path d="M17.5 26.5 C14.5 23 11 25 12.5 29 C15 30 16.5 28 17.5 26.5 Z" fill="#60A547" stroke="#3D271D" stroke-width="0.8"/>
            <path d="M21.5 26.5 C24.5 23 28 25 26.5 29 C24 30 22.5 28 21.5 26.5 Z" fill="#78B95E" stroke="#3D271D" stroke-width="0.8"/>
            <ellipse cx="14" cy="16" rx="2.8" ry="3.8" fill="#291810"/>
            <circle cx="13" cy="14.8" r="1.2" fill="#FFFFFF"/>
            <ellipse cx="25" cy="16" rx="2.8" ry="3.8" fill="#291810"/>
            <circle cx="24" cy="14.8" r="1.2" fill="#FFFFFF"/>
            <path d="M17.8 17.5 L21.2 17.5 L19.5 20 Z" fill="#FFFFFF"/>
            <path d="M17.8 19.5 L21.2 19.5 L19.5 22.5 Z" fill="#F97316" stroke="#4A3226" stroke-width="0.5"/>
            <ellipse cx="10" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/>
            <ellipse cx="29" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/>
          </svg>
        </div>
        <div class="header-text">
          <h2>CamoDex ✦</h2>
          <p><span class="status-dot"></span><span>Online • Seu parceiro de jornada</span></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="replayIntroBtn" title="Reexibir Intro GSAP"><i data-lucide="play-circle" style="width: 18px;"></i></button>
        <button class="icon-btn" id="clearBtn" title="Limpar Conversa"><i data-lucide="trash-2" style="width: 18px;"></i></button>
      </div>
    </header>

    <main class="chat-messages" id="chatMessages">
      <div class="message-row bot">
        <div class="msg-avatar">
          <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="#F4E8D8" stroke="#4A3226" stroke-width="1.5"/>
            <path d="M8.5 17 C8.5 12 14.5 11 19.5 16 C24.5 11 31.5 12 31.5 17 Z" fill="#FFFFFF"/>
            <path d="M17.5 26.5 C14.5 23 11 25 12.5 29 C15 30 16.5 28 17.5 26.5 Z" fill="#60A547"/>
            <ellipse cx="14" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="13" cy="14.8" r="1.2" fill="#FFF"/>
            <ellipse cx="25" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="24" cy="14.8" r="1.2" fill="#FFF"/>
            <path d="M17.8 19.5 L21.2 19.5 L19.5 22.5 Z" fill="#F97316"/>
            <ellipse cx="10" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/>
            <ellipse cx="29" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/>
          </svg>
        </div>
        <div class="message-bubble">
          <p>Olá! Seja muito bem-vindo(a) ao <strong>CamoDex</strong> ✨</p>
          <p style="margin-top: 6px;">Eu sou a sua Pokédex e assistente de jornada inteligente. Como posso ajudar nas suas estratégias hoje?</p>
          <span class="message-time">Agora</span>
        </div>
      </div>
    </main>

    <div class="quick-prompts-container">
      <button class="prompt-chip" onclick="sendQuickPrompt('Quais os melhores tipos de Pokémon?')">
        <span class="chip-pokeball-icon"></span>
        <span>Quais os melhores tipos de Pokémon?</span>
      </button>
      <button class="prompt-chip" onclick="sendQuickPrompt('Como funciona a tabela de vantagens e fraquezas?')">
        <span class="chip-pokeball-icon"></span>
        <span>Vantagens e Fraquezas</span>
      </button>
      <button class="prompt-chip" onclick="sendQuickPrompt('O que é o assistente CamoDex?')">
        <span class="chip-pokeball-icon"></span>
        <span>O que é o CamoDex?</span>
      </button>
      <button class="prompt-chip" onclick="sendQuickPrompt('Dicas para novos treinadores')">
        <span class="chip-pokeball-icon"></span>
        <span>Dicas de Treinador</span>
      </button>

    <footer class="input-area">
      <form id="chatForm" onsubmit="handleSend(event)">
        <div class="input-wrapper">
          <input type="text" id="userInput" class="chat-input" placeholder="Digite sua dúvida ou use o microfone..." autocomplete="off" />
          <div class="input-buttons">
            <button type="button" class="action-btn mic-btn" id="micBtn" title="Falar por voz"><i data-lucide="mic" style="width: 18px;"></i></button>
            <button type="submit" class="action-btn send-btn" id="sendBtn" title="Enviar mensagem"><i data-lucide="send" style="width: 18px;"></i></button>
          </div>
        </div>
      </form>
      <div class="footer-credits">CamoDex ✦ Assistente IA de Suporte e Conhecimento</div>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    const API_BASE_URL = 'http://127.0.0.1:8000';
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');
    const clearBtn = document.getElementById('clearBtn');
    const replayIntroBtn = document.getElementById('replayIntroBtn');
    const skipIntroBtn = document.getElementById('skipIntroBtn');
    const introOverlay = document.getElementById('introOverlay');
    let isListening = false;
    let recognition = null;
    let introTimeline = null;

    function runIntroAnimation() {
      introOverlay.style.display = 'flex';
      introOverlay.style.opacity = '1';

      if (introTimeline) introTimeline.kill();

      introTimeline = gsap.timeline({
        onComplete: () => {
          gsap.to(introOverlay, {
            opacity: 0,
            duration: 0.8,
            ease: 'power2.inOut',
            onComplete: () => { introOverlay.style.display = 'none'; }
          });
        }
      });

      introTimeline.fromTo('#introPokeball',
        { y: -500, rotation: -720, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 1.2, ease: 'bounce.out' }
      );

      introTimeline
        .to('#introPokeball', { rotation: -12, duration: 0.1, ease: 'power1.inOut' })
        .to('#introPokeball', { rotation: 12, duration: 0.1, ease: 'power1.inOut' })
        .to('#introPokeball', { rotation: -12, duration: 0.1, ease: 'power1.inOut' })
        .to('#introPokeball', { rotation: 12, duration: 0.1, ease: 'power1.inOut' })
        .to('#introPokeball', { rotation: 0, duration: 0.1, ease: 'power1.inOut' });

      introTimeline.fromTo('#introLogo',
        { scale: 0, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: 'back.out(1.7)' },
        "-=0.1"
      );

      introTimeline.to({}, { duration: 0.9 });
    }

    window.addEventListener('DOMContentLoaded', runIntroAnimation);

    skipIntroBtn.addEventListener('click', () => {
      if (introTimeline) introTimeline.progress(1);
      gsap.to(introOverlay, { opacity: 0, duration: 0.3, onComplete: () => { introOverlay.style.display = 'none'; } });
    });

    replayIntroBtn.addEventListener('click', runIntroAnimation);

    const fallbackResponses = {
      "melhores tipos": "Os tipos **Dragão**, **Fogo** e **Elétrico** possuem alta cobertura ofensiva. Já o tipo **Aço** oferece as melhores defesas do jogo!",
      "vantagens": "Vantagens fundamentais:\n• **Água** vence Fogo\n• **Fogo** vence Planta\n• **Planta** vence Água\n• **Elétrico** vence Água e Voador",
      "camodex": "O **CamoDex** é sua Pokédex e assistente inteligente desenvolvida para tirar dúvidas sobre Pokémon com precisão!",
      "dicas": "Dicas essenciais:\n1. Mantenha tipos variados na equipe.\n2. Tenha pelo menos um Pokémon focado em suporte e cura."
    };

    function getTimeString() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(sender, text) {
      const row = document.createElement('div');
      row.className = `message-row ${sender}`;
      const avatarHtml = sender === 'bot' 
        ? `<div class="msg-avatar"><svg width="24" height="24" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="#F4E8D8" stroke="#4A3226" stroke-width="1.5"/><path d="M8.5 17 C8.5 12 14.5 11 19.5 16 C24.5 11 31.5 12 31.5 17 Z" fill="#FFFFFF"/><path d="M17.5 26.5 C14.5 23 11 25 12.5 29 C15 30 16.5 28 17.5 26.5 Z" fill="#60A547"/><ellipse cx="14" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="13" cy="14.8" r="1.2" fill="#FFF"/><ellipse cx="25" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="24" cy="14.8" r="1.2" fill="#FFF"/><path d="M17.8 19.5 L21.2 19.5 L19.5 22.5 Z" fill="#F97316"/><ellipse cx="10" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/><ellipse cx="29" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/></svg></div>`
        : `<div class="msg-avatar" style="background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4);"><i data-lucide="user" style="width: 18px; color: #fff;"></i></div>`;

      const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

      row.innerHTML = `
        ${avatarHtml}
        <div class="message-bubble">
          <p>${formattedText}</p>
          <span class="message-time">${getTimeString()}</span>
        </div>
      `;

      chatMessages.appendChild(row);
      lucide.createIcons();
      scrollToBottom();
    }

    function showTypingIndicator() {
      const typingRow = document.createElement('div');
      typingRow.id = 'typingIndicator';
      typingRow.className = 'message-row bot';
      typingRow.innerHTML = `
        <div class="msg-avatar"><svg width="24" height="24" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="#F4E8D8" stroke="#4A3226" stroke-width="1.5"/><path d="M8.5 17 C8.5 12 14.5 11 19.5 16 C24.5 11 31.5 12 31.5 17 Z" fill="#FFFFFF"/><ellipse cx="14" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="13" cy="14.8" r="1.2" fill="#FFF"/><ellipse cx="25" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="24" cy="14.8" r="1.2" fill="#FFF"/><path d="M17.8 19.5 L21.2 19.5 L19.5 22.5 Z" fill="#F97316"/></svg></div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      chatMessages.appendChild(typingRow);
      lucide.createIcons();
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      showTypingIndicator();

      try {
        const response = await fetch(`${API_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        if (response.ok) {
          const data = await response.json();
          removeTypingIndicator();
          appendMessage('bot', data.response || data.message || "Resposta recebida!");
        } else {
          throw new Error('API Offline');
        }
      } catch (err) {
        setTimeout(() => {
          removeTypingIndicator();
          let responseText = "Entendi sua pergunta! Como posso te ajudar mais detalhadamente?";
          const lower = text.toLowerCase();

          for (const [key, val] of Object.entries(fallbackResponses)) {
            if (lower.includes(key)) {
              responseText = val;
              break;
            }
          }
          appendMessage('bot', responseText);
        }, 700);
      }
    }

    function sendQuickPrompt(promptText) {
      userInput.value = promptText;
      handleSend();
    }

    clearBtn.addEventListener('click', () => {
      chatMessages.innerHTML = `
        <div class="message-row bot">
          <div class="msg-avatar"><svg width="24" height="24" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="#F4E8D8" stroke="#4A3226" stroke-width="1.5"/><path d="M8.5 17 C8.5 12 14.5 11 19.5 16 C24.5 11 31.5 12 31.5 17 Z" fill="#FFFFFF"/><path d="M17.5 26.5 C14.5 23 11 25 12.5 29 C15 30 16.5 28 17.5 26.5 Z" fill="#60A547"/><ellipse cx="14" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="13" cy="14.8" r="1.2" fill="#FFF"/><ellipse cx="25" cy="16" rx="2.8" ry="3.8" fill="#291810"/><circle cx="24" cy="14.8" r="1.2" fill="#FFF"/><path d="M17.8 19.5 L21.2 19.5 L19.5 22.5 Z" fill="#F97316"/><ellipse cx="10" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/><ellipse cx="29" cy="20" rx="2.2" ry="1.4" fill="rgba(244, 114, 182, 0.65)"/></svg></div>
          <div class="message-bubble">
            <p>Conversa reiniciada com sucesso! ✨ Como posso ajudar agora?</p>
            <span class="message-time">${getTimeString()}</span>
          </div>
        </div>
      `;
      lucide.createIcons();
    });

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      recognition.onstart = () => { isListening = true; micBtn.classList.add('listening'); };
      recognition.onresult = (event) => { userInput.value = event.results[0][0].transcript; handleSend(); };
      recognition.onerror = recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); };

      micBtn.addEventListener('click', () => {
        if (isListening) recognition.stop();
        else recognition.start();
      });
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
